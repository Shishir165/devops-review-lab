# Cron configuration for DevOps Review Lab
# --------------------------------------

# Run system health check every 15 minutes
*/15 * * * * /opt/devops-review-lab/scripts/health-check.sh >> /var/log/health-check.log 2>&1

# Run backup script daily at 2 AM
0 2 * * * /opt/devops-review-lab/scripts/backup.sh >> /var/log/backup.log 2>&1

# Clean up old logs weekly (Sunday at 3 AM)
0 3 * * 0 find /var/log -name "*.log" -mtime +7 -delete

